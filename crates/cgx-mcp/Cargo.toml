[package]
name = "cgx-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for cgx — JSON-RPC stdio server for AI editor integrations"
license = "MIT"
repository = "https://github.com/AayushBahukhandi/cgx"
keywords = ["mcp", "ai", "codebase", "knowledge-graph"]
categories = ["development-tools"]

[dependencies]
cgx-core = { path = "../cgx-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = "0.4"
