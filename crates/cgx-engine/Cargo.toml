[package]
name = "cgx-engine"
version = "0.5.0"
edition = "2021"
description = "Core engine for cgx — Tree-sitter parsing, DuckDB graph storage, git analysis, and clustering"
readme = "README.md"
license = "MIT"
repository = "https://github.com/AayushBahukhandi/cgx"
homepage = "https://aayushbahukhandi.github.io/cgx/"
documentation = "https://docs.rs/cgx-engine"
keywords = ["tree-sitter", "knowledge-graph", "static-analysis", "git", "duckdb"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-go = "0.21"
tree-sitter-java = "0.21"
tree-sitter-php = "0.22"
duckdb = { version = "1.10502.0", features = ["bundled"] }
rayon = "1.10"
ignore = "0.4"
dirs = "5"
sha2 = "0.10"
git2 = { version = "0.18", features = ["vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
