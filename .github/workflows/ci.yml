name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test-rust:
    name: Test Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h

      - name: Install C++ build tools (required by libduckdb-sys and libgit2 bundled builds)
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential g++ cmake

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Create web UI dist stub (required by RustEmbed at compile time)
        run: mkdir -p crates/cgx-cli/web-ui-dist && echo '<!DOCTYPE html><html></html>' > crates/cgx-cli/web-ui-dist/index.html

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Initialize git test fixture
        run: |
          cd crates/cgx-engine/tests/fixtures/git-sample
          git init
          git config user.email "alice@dev.io"
          git config user.name "Alice"
          git add src/auth.ts src/db.ts
          git commit -m "commit 1" --author="Alice <alice@dev.io>"
          echo "// update" >> src/auth.ts
          echo "// update" >> src/db.ts
          git add src/auth.ts src/db.ts
          git commit -m "commit 2" --author="Alice <alice@dev.io>"
          git config user.email "bob@dev.io"
          git config user.name "Bob"
          echo "// router" >> src/router.ts
          git add src/router.ts
          git commit -m "commit 3" --author="Bob <bob@dev.io>"
          git config user.email "alice@dev.io"
          git config user.name "Alice"
          echo "// update2" >> src/auth.ts
          echo "// update2" >> src/db.ts
          git add src/auth.ts src/db.ts
          git commit -m "commit 4" --author="Alice <alice@dev.io>"

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings -D clippy::unwrap_used

      - name: Check formatting
        run: cargo fmt --all -- --check

  test-web-ui:
    name: Test Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web UI
        run: npm run build

      - name: Type-check web UI
        run: npm run typecheck || true

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-rust, test-web-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --workspace --release --locked

      - name: Install web UI
        run: npm ci && npm run build

      - name: Run integration tests
        run: ./scripts/integration-test.sh
        env:
          CGX_BIN: ${{ github.workspace }}/target/release/cgx
