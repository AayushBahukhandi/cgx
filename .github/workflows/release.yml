name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and build web UI
        run: npm ci && npm run build

      - name: Build binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cgx dist/
          cp -r packages/web-ui/dist dist/web-ui
          cd dist
          tar czf ../cgx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz cgx web-ui

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/cgx.exe dist/
          Copy-Item -Recurse packages/web-ui/dist dist/web-ui
          Compress-Archive -Path dist\* -DestinationPath cgx-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cgx-${{ matrix.target }}
          path: |
            cgx-*.tar.gz
            cgx-*.zip

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install C++ build tools (required by libduckdb-sys bundled compilation)
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential g++ cmake

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish cgx-engine
        run: cargo publish --package cgx-engine --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Wait for cgx-engine to be indexed
        run: sleep 30

      - name: Publish cgx-mcp
        run: cargo publish --package cgx-mcp --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Wait for cgx-mcp to be indexed
        run: sleep 30

      - name: Publish cgx-cli
        run: cargo publish --package cgx-cli --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 hashes
        id: sha
        run: |
          VERSION=${{ github.ref_name }}
          DARWIN_ARM=$(sha256sum artifacts/cgx-${VERSION}-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          DARWIN_INTEL=$(sha256sum artifacts/cgx-${VERSION}-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          LINUX_INTEL=$(sha256sum artifacts/cgx-${VERSION}-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          echo "darwin_arm=$DARWIN_ARM" >> $GITHUB_OUTPUT
          echo "darwin_intel=$DARWIN_INTEL" >> $GITHUB_OUTPUT
          echo "linux_intel=$LINUX_INTEL" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: AayushBahukhandi/homebrew-cgx
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION=${{ github.ref_name }}
          cat > homebrew-tap/Formula/cgx.rb << EOF
          class Cgx < Formula
            desc "Turn any Git repository into a queryable knowledge graph"
            homepage "https://github.com/AayushBahukhandi/cgx"
            version "${VERSION#v}"
            license "MIT"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/AayushBahukhandi/cgx/releases/download/${VERSION}/cgx-${VERSION}-aarch64-apple-darwin.tar.gz"
              sha256 "${{ steps.sha.outputs.darwin_arm }}"
            elsif OS.mac? && Hardware::CPU.intel?
              url "https://github.com/AayushBahukhandi/cgx/releases/download/${VERSION}/cgx-${VERSION}-x86_64-apple-darwin.tar.gz"
              sha256 "${{ steps.sha.outputs.darwin_intel }}"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/AayushBahukhandi/cgx/releases/download/${VERSION}/cgx-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${{ steps.sha.outputs.linux_intel }}"
            end

            def install
              bin.install "cgx"
              pkgshare.install "web-ui"
            end

            def caveats
              <<~EOS
                cgx has been installed.

                Quick start:
                  cd your-project
                  cgx analyze
                  cgx view --web

                For AI editor integration:
                  cgx setup

                To check your installation:
                  cgx doctor
              EOS
            end

            test do
              system "#{bin}/cgx", "--version"
            end
          end
          EOF

      - name: Commit and push formula update
        run: |
          VERSION=${{ github.ref_name }}
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cgx.rb
          git commit -m "cgx ${VERSION}"
          git push
