name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and build web UI
        run: npm ci && npm run build

      - name: Build binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cgx dist/
          cp -r packages/web-ui/dist dist/web-ui
          cd dist
          tar czf ../cgx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz cgx web-ui

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/cgx.exe dist/
          Copy-Item -Recurse packages/web-ui/dist dist/web-ui
          Compress-Archive -Path dist\* -DestinationPath cgx-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cgx-${{ matrix.target }}
          path: |
            cgx-*.tar.gz
            cgx-*.zip

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install C++ build tools (required by libduckdb-sys bundled compilation)
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential g++ cmake

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish cgx-engine
        run: cargo publish --package cgx-engine --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Wait for cgx-engine to be indexed
        run: sleep 30

      - name: Publish cgx-mcp
        run: cargo publish --package cgx-mcp --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Wait for cgx-mcp to be indexed
        run: sleep 30

      - name: Publish cgx-cli
        run: cargo publish --package cgx-cli --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
